<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Contoh Font</title>
<style>
p.warna {
  color: blue;
}
p.sansserif {
  font-family: Arial, Helvetica, sans-serif;
}
p.small {
  font-variant: small-caps;
}
p.weight {
  font-weight: bold;
}
p.italic {
  font-style: italic;
}
p.size {
  font-size: 20px;
}
</style>
</head>
<body>

<p class="warna">Universitas Bina Sarana Informatika</p>
<p class="sansserif">Universitas Bina Sarana Informatika</p>
<p class="small">Universitas Bina Sarana Informatika</p>
<p class="weight">Universitas Bina Sarana Informatika</p>
<p class="italic">Universitas Bina Sarana Informatika</p>
<p class="size">Universitas Bina Sarana Informatika</p>

</body>
</html>
